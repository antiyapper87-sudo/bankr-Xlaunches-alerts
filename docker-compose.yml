services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankr_alerts
      POSTGRES_USER: bankr
      POSTGRES_PASSWORD: bankr
    ports:
      - "5432:5432"
    volumes:
      - bankr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankr -d bankr_alerts"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bankr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bankr_postgres_data:
  bankr_redis_data:
